<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="100%" height="100%" style="background:#ffffff; border-radius:8px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="h-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="h-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <text x="370" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Vòng Trễ Hysteresis &amp; Cơ Chế Khử Rung Giật (Chattering) Trong FSM</text>
  <text x="370" y="48" text-anchor="middle" font-size="12" fill="#64748b">Thiết lập 2 ngưỡng chuyển trạng thái để triệt tiêu dao động chuyển mạch liên tục khi bám tường</text>

  <!-- Coordinate Axes -->
  <line x1="80" y1="280" x2="680" y2="280" stroke="#0f172a" stroke-width="2" marker-end="url(#h-arrow)" />
  <line x1="80" y1="280" x2="80" y2="80" stroke="#0f172a" stroke-width="2" marker-end="url(#h-arrow)" />
  <text x="685" y="285" font-size="12" font-weight="bold" fill="#0f172a">Khoảng cách đo được d (cm)</text>
  <text x="80" y="70" font-size="12" font-weight="bold" fill="#0f172a">Trạng thái FSM</text>

  <!-- State Levels -->
  <text x="20" y="145" font-size="11" font-weight="bold" fill="#2563eb">RẼ TRÁI</text>
  <text x="20" y="235" font-size="11" font-weight="bold" fill="#dc2626">RẼ PHẢI</text>
  <line x1="75" y1="140" x2="670" y2="140" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="75" y1="230" x2="670" y2="230" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Thresholds tau_low and tau_high -->
  <line x1="260" y1="80" x2="260" y2="280" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" />
  <text x="260" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">τ_low = 12 cm</text>
  <text x="260" y="322" text-anchor="middle" font-size="10" fill="#dc2626">(Ngưỡng thấp)</text>

  <line x1="480" y1="80" x2="480" y2="280" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" />
  <text x="480" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">τ_high = 18 cm</text>
  <text x="480" y="322" text-anchor="middle" font-size="10" fill="#2563eb">(Ngưỡng cao)</text>

  <!-- Deadband / Hysteresis Region Shading -->
  <rect x="260" y="80" width="220" height="200" fill="#f1f5f9" opacity="0.6" />
  <text x="370" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">Vùng trễ Hysteresis (Δ = 6 cm)</text>
  <text x="370" y="122" text-anchor="middle" font-size="10.5" fill="#64748b">(Giữ nguyên trạng thái cũ, không nhảy loạn)</text>

  <!-- Hysteresis Curve Loop -->
  <!-- Top Branch: Turn Left when d > tau_high -->
  <path d="M 120 140 L 480 140 L 480 230 L 650 230" fill="none" stroke="#2563eb" stroke-width="3" />
  <line x1="400" y1="140" x2="450" y2="140" stroke="#2563eb" stroke-width="3" marker-end="url(#h-arrow)" />

  <!-- Bottom Branch: Turn Right when d < tau_low -->
  <path d="M 650 230 L 260 230 L 260 140 L 120 140" fill="none" stroke="#dc2626" stroke-width="3" />
  <line x1="330" y1="230" x2="280" y2="230" stroke="#dc2626" stroke-width="3" marker-end="url(#h-arrow-red)" />

  <!-- Explanation Tags -->
  <g transform="translate(495, 145)">
    <rect width="170" height="42" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="10" y="18" font-size="10" font-weight="bold" fill="#1e40af">Khi d vượt quá 18 cm:</text>
    <text x="10" y="32" font-size="9.5" fill="#1e3a8a">Chuyển sang RẼ PHẢI để ép sát</text>
  </g>

  <g transform="translate(90, 215)">
    <rect width="165" height="42" rx="4" fill="#fef2f2" stroke="#fecaca" />
    <text x="10" y="18" font-size="10" font-weight="bold" fill="#991b1b">Khi d tụt dưới 12 cm:</text>
    <text x="10" y="32" font-size="9.5" fill="#991b1b">Chuyển sang RẼ TRÁI để tránh</text>
  </g>
</svg>