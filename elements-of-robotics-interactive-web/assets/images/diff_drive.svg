<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" width="100%" height="100%" style="background:#ffffff; border-radius:8px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="375" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Mô Hình Động Học Robot Bánh Vi Sai &amp; Tâm Quay Tức Thời (ICC)</text>
  <text x="375" y="52" text-anchor="middle" font-size="12" fill="#64748b">Biểu diễn tọa độ bánh xe, vận tốc tiếp tuyến v_l, v_r và bán kính cong R_c</text>

  <!-- Instantaneous Center of Curvature (ICC) -->
  <g transform="translate(120, 260)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="-12" y="-14" font-size="14" font-weight="bold" fill="#dc2626">ICC</text>
    <text x="-12" y="24" font-size="10" fill="#dc2626">(Tâm quay tức thời)</text>
  </g>

  <!-- Rotation Arc / Angular Velocity omega -->
  <path d="M 170 190 A 90 90 0 0 1 170 330" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <text x="185" y="265" font-size="13" font-weight="bold" fill="#8b5cf6">ω = (v_r - v_l) / b</text>

  <!-- Baseline from ICC to Wheel Axle -->
  <line x1="120" y1="260" x2="520" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5" />

  <!-- Robot Body Chassis -->
  <!-- Centered at (520, 260) with heading angle approx 20 deg tilted for dynamics -->
  <g transform="translate(520, 260)">
    <!-- Chassis Body Outline -->
    <rect x="-45" y="-105" width="90" height="210" rx="35" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    
    <!-- Castor wheel front -->
    <circle cx="0" cy="-80" r="10" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
    <text x="18" y="-76" font-size="9" fill="#64748b">Bánh lái tự do (Castor)</text>

    <!-- Center Point C (x, y) -->
    <circle cx="0" cy="0" r="5" fill="#2563eb" />
    <text x="8" y="15" font-size="13" font-weight="bold" fill="#1d4ed8">C (x, y, θ)</text>

    <!-- Left Wheel (Top in coordinate) -->
    <rect x="-14" y="-120" width="28" height="30" rx="4" fill="#1e293b" />
    <text x="-65" y="-105" font-size="11" font-weight="bold" fill="#1e293b">Bánh trái</text>
    <!-- Left Wheel Velocity Vector v_l -->
    <line x1="0" y1="-105" x2="0" y2="-175" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)" />
    <text x="8" y="-145" font-size="12" font-weight="bold" fill="#dc2626">v_l = ω_l · R</text>

    <!-- Right Wheel (Bottom in coordinate) -->
    <rect x="-14" y="90" width="28" height="30" rx="4" fill="#1e293b" />
    <text x="-65" y="110" font-size="11" font-weight="bold" fill="#1e293b">Bánh phải</text>
    <!-- Right Wheel Velocity Vector v_r (longer because v_r > v_l for turning left) -->
    <line x1="0" y1="105" x2="0" y2="215" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)" />
    <text x="8" y="175" font-size="12" font-weight="bold" fill="#dc2626">v_r = ω_r · R</text>

    <!-- Robot Center Linear Velocity v -->
    <line x1="0" y1="0" x2="0" y2="-85" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="8" y="-45" font-size="12" font-weight="bold" fill="#16a34a">v = (v_r + v_l) / 2</text>

    <!-- Wheelbase dimension line b -->
    <line x1="60" y1="-105" x2="60" y2="105" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)" />
    <text x="70" y="5" font-size="13" font-weight="bold" fill="#475569">b (Bề rộng cơ sở)</text>
  </g>

  <!-- Curvature Radius R_c dimension line from ICC to C -->
  <line x1="120" y1="380" x2="520" y2="380" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="320" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Bán kính cong R_c = (b / 2) · (v_r + v_l) / (v_r - v_l)</text>

  <!-- Coordinate Legend Box -->
  <g transform="translate(40, 75)">
    <rect width="210" height="95" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="12" y="20" font-size="11" font-weight="bold" fill="#0f172a">Định lý Động học Vi sai:</text>
    <text x="12" y="40" font-size="10.5" fill="#334155">• Điểm tiếp xúc bánh xe không trượt</text>
    <text x="12" y="58" font-size="10.5" fill="#334155">• v_r &gt; v_l : Robot rẽ trái quanh ICC</text>
    <text x="12" y="76" font-size="10.5" fill="#334155">• v_r = v_l : R_c → ∞ (Chạy thẳng)</text>
    <text x="12" y="94" font-size="10.5" fill="#334155">• v_r = -v_l : R_c = 0 (Xoay tại chỗ quanh C)</text>
  </g>
</svg>